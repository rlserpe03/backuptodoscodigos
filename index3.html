<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Premiação Escolar</title>
    <style>
        /* ==========================================================================
           1. ESTILOS GERAIS E PALETA DE CORES (AZUL, AMARELO E BRANCO)
           ========================================================================== */
        :root {
            --azul-principal: #1e88e5;
            --azul-escuro: #1565c0;
            --amarelo-principal: #fbc02d;
            --amarelo-claro: #fff59d;
            --branco: #ffffff;
            --cinza-fundo: #f4f6f9;
            --texto: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--cinza-fundo);
            color: var(--texto);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Cabeçalho Responsivo */
        header {
            background-color: var(--azul-principal);
            color: var(--branco);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 1.4rem;
        }

        .btn-logout {
            background-color: var(--amarelo-principal);
            color: #000;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-logout:hover {
            background-color: #fdd835;
        }

        /* Container Principal */
        main {
            flex: 1;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }

        /* Estilo dos Cartões e Painéis */
        .card {
            background: var(--branco);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border-top: 5px solid var(--azul-principal);
        }

        h2 {
            margin-bottom: 15px;
            color: var(--azul-escuro);
        }

        /* Formulários e Inputs */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
        }

        button.btn-acao {
            background-color: var(--azul-principal);
            color: var(--branco);
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        button.btn-acao:hover {
            background-color: var(--azul-escuro);
        }

        /* Destaque de Pontuação (Cartão Amarelo) */
        .placar-pontos {
            background-color: var(--amarelo-claro);
            border: 2px solid var(--amarelo-principal);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .placar-pontos h3 {
            font-size: 2.5rem;
            color: #555;
        }

        /* Listas e Ocorrências */
        .lista-item {
            border-bottom: 1px solid #eee;
            padding: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .lista-item:last-child {
            border-bottom: none;
        }

        .tag-pontos {
            background-color: var(--amarelo-principal);
            padding: 5px 10px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        /* Utilitário para alternar visibilidade */
        .oculto {
            display: none !important;
        }

        /* Responsividade para Celulares */
        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
            main {
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO DA PÁGINA -->
    <header>
        <h1>🏆 Escola do Futuro</h1>
        <div id="area-usuario" class="oculto">
            <span id="nome-perfil"></span>
            <button class="btn-logout" onclick="fazerLogout()">Sair</button>
        </div>
    </header>

    <main>
        <!-- ==========================================================================
             TELAS DE LOGIN E PAINÉIS DOS PERFIS
             ========================================================================== -->

        <!-- TELA 1: LOGIN -->
        <section id="tela-login" class="card">
            <h2>Acesso ao Sistema</h2>
            <div class="form-group">
                <label for="tipo-usuario">Selecione o seu perfil:</label>
                <select id="tipo-usuario">
                    <option value="professor">Professor</option>
                    <option value="aluno">Aluno / Pais</option>
                    <option value="adm">Administrador</option>
                </select>
            </div>
            <button class="btn-acao" onclick="fazerLogin()">Entrar</button>
        </section>

        <!-- TELA 2: PAINEL DO PROFESSOR -->
        <section id="painel-professor" class="oculto">
            <div class="card">
                <h2>Lançar Pontos ou Ocorrência</h2>
                <div class="form-group">
                    <label for="prof-aluno-select">Selecione o Aluno:</label>
                    <select id="prof-aluno-select">
                        <option value="0">João Silva (6º Ano A)</option>
                        <option value="1">Maria Oliveira (6º Ano A)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="tipo-registro">Tipo de Lançamento:</label>
                    <select id="tipo-registro" onchange="alternarCamposProfessor()">
                        <option value="ponto">Atribuir Pontos (Premiação)</option>
                        <option value="ocorrencia">Registrar Ocorrência</option>
                    </select>
                </div>

                <!-- Campo para Pontos -->
                <div id="grupo-pontos" class="form-group">
                    <label for="qtd-pontos">Quantidade de Pontos:</label>
                    <input type="number" id="qtd-pontos" value="5" min="1">
                    <label for="motivo-ponto" style="margin-top:10px;">Motivo:</label>
                    <input type="text" id="motivo-ponto" placeholder="Ex: Tarefa entregue no prazo">
                </div>

                <!-- Campo para Ocorrência -->
                <div id="grupo-ocorrencia" class="form-group oculto">
                    <label for="desc-ocorrencia">Descrição da Ocorrência:</label>
                    <textarea id="desc-ocorrencia" rows="3" placeholder="Descreva o ocorrido para os pais..."></textarea>
                </div>

                <button class="btn-acao" onclick="salvarLancamentoProfessor()">Confirmar Lançamento</button>
            </div>
        </section>

        <!-- TELA 3: PAINEL DO ALUNO / PAIS -->
        <section id="painel-aluno" class="oculto">
            <div class="placar-pontos">
                <h2>Sua Pontuação Total</h2>
                <h3 id="exibir-pontos">0</h3>
                <p>Continue se dedicando!</p>
            </div>

            <div class="card">
                <h2>Histórico de Ocorrências e Observações</h2>
                <div id="lista-ocorrencias-aluno">
                    <!-- Ocorrências serão inseridas aqui dinamicamente -->
                </div>
            </div>
        </section>

        <!-- TELA 4: PAINEL DO ADMINISTRADOR -->
        <section id="painel-adm" class="oculto">
            <!-- Cadastro Manual -->
            <div class="card">
                <h2>Cadastrar Turma / Aluno</h2>
                <div class="form-group">
                    <label for="adm-nome-aluno">Nome do Aluno:</label>
                    <input type="text" id="adm-nome-aluno" placeholder="Nome completo">
                </div>
                <div class="form-group">
                    <label for="adm-turma">Turma:</label>
                    <input type="text" id="adm-turma" placeholder="Ex: 7º Ano B">
                </div>
                <button class="btn-acao" onclick="cadastrarAlunoManual()">Cadastrar Aluno</button>
            </div>

            <!-- Importação de Planilha (CSV) -->
            <div class="card">
                <h2>Importar Alunos via Planilha (CSV)</h2>
                <p style="margin-bottom: 10px; font-size: 0.9rem;">
                    Selecione um arquivo .csv no formato: <strong>Nome,Turma</strong>
                </p>
                <div class="form-group">
                    <input type="file" id="arquivo-csv" accept=".csv">
                </div>
                <button class="btn-acao" style="background-color: var(--amarelo-principal); color:#000;" onclick="importarCSV()">Importar Planilha</button>
            </div>

            <div class="card">
                <h2>Alunos Cadastrados</h2>
                <div id="lista-alunos-adm"></div>
            </div>
        </section>
    </main>

    <!-- ==========================================================================
         4. CÓDIGO JAVASCRIPT - LÓGICA DA APLICAÇÃO
         ========================================================================== -->
    <script>
        // Dados simulados mantidos na memória
        let alunos = [
            { id: 0, nome: "João Silva", turma: "6º Ano A", pontos: 15, ocorrencias: ["Chegou atrasado na aula de Matemática."] },
            { id: 1, nome: "Maria Oliveira", turma: "6º Ano A", pontos: 30, ocorrencias: [] }
        ];

        // Função de Login (Simulação de controle de acesso)
        function fazerLogin() {
            const perfil = document.getElementById('tipo-usuario').value;

            // Oculta tela de login
            document.getElementById('tela-login').classList.add('oculto');
            document.getElementById('area-usuario').classList.remove('oculto');

            // Exibe o painel correspondente ao perfil selecionado
            if (perfil === 'professor') {
                document.getElementById('nome-perfil').innerText = "Perfil: Professor";
                document.getElementById('painel-professor').classList.remove('oculto');
                atualizarSelectProfessores();
            } else if (perfil === 'aluno') {
                document.getElementById('nome-perfil').innerText = "Perfil: Aluno / Pais (João Silva)";
                document.getElementById('painel-aluno').classList.remove('oculto');
                carregarDadosAluno(0); // Simula visualização do primeiro aluno (João Silva)
            } else if (perfil === 'adm') {
                document.getElementById('nome-perfil').innerText = "Perfil: Administrador";
                document.getElementById('painel-adm').classList.remove('oculto');
                atualizarListaAdm();
            }
        }

        // Função de Logout
        function fazerLogout() {
            // Oculta todos os painéis
            document.getElementById('painel-professor').classList.add('oculto');
            document.getElementById('painel-aluno').classList.add('oculto');
            document.getElementById('painel-adm').classList.add('oculto');
            document.getElementById('area-usuario').classList.add('oculto');

            // Exibe tela de login novamente
            document.getElementById('tela-login').classList.remove('oculto');
        }

        // LÓGICA DO PROFESSOR
        function alternarCamposProfessor() {
            const tipo = document.getElementById('tipo-registro').value;
            if (tipo === 'ponto') {
                document.getElementById('grupo-pontos').classList.remove('oculto');
                document.getElementById('grupo-ocorrencia').classList.add('oculto');
            } else {
                document.getElementById('grupo-pontos').classList.add('oculto');
                document.getElementById('grupo-ocorrencia').classList.remove('oculto');
            }
        }

        function salvarLancamentoProfessor() {
            const alunoId = document.getElementById('prof-aluno-select').value;
            const tipo = document.getElementById('tipo-registro').value;

            if (tipo === 'ponto') {
                const qtd = parseInt(document.getElementById('qtd-pontos').value) || 0;
                alunos[alunoId].pontos += qtd;
                alert(`Sucesso! ${qtd} pontos adicionados para ${alunos[alunoId].nome}.`);
            } else {
                const desc = document.getElementById('desc-ocorrencia').value;
                if(desc.trim() === "") { alert("Por favor, digite a descrição da ocorrência."); return; }
                alunos[alunoId].ocorrencias.push(desc);
                alert(`Ocorrência registrada com sucesso para ${alunos[alunoId].nome}.`);
                document.getElementById('desc-ocorrencia').value = "";
            }
        }

        function atualizarSelectProfessores() {
            const select = document.getElementById('prof-aluno-select');
            select.innerHTML = "";
            alunos.forEach((aluno, index) => {
                select.innerHTML += `<option value="${index}">${aluno.nome} (${aluno.turma})</option>`;
            });
        }

        // LÓGICA DO ALUNO
        function carregarDadosAluno(id) {
            const aluno = alunos[id];
            document.getElementById('exibir-pontos').innerText = aluno.pontos;

            const listaOcorrencias = document.getElementById('lista-ocorrencias-aluno');
            listaOcorrencias.innerHTML = "";

            if (aluno.ocorrencias.length === 0) {
                listaOcorrencias.innerHTML = "<p>Nenhuma ocorrência registrada! Parabéns!</p>";
            } else {
                aluno.ocorrencias.forEach(oc => {
                    listaOcorrencias.innerHTML += `<div class="lista-item">📌 ${oc}</div>`;
                });
            }
        }

        // LÓGICA DO ADMINISTRADOR
        function cadastrarAlunoManual() {
            const nome = document.getElementById('adm-nome-aluno').value;
            const turma = document.getElementById('adm-turma').value;

            if(nome === "" || turma === "") {
                alert("Preencha todos os campos!");
                return;
            }

            alunos.push({ id: alunos.length, nome: nome, turma: turma, pontos: 0, ocorrencias: [] });
            alert("Aluno cadastrado com sucesso!");
            document.getElementById('adm-nome-aluno').value = "";
            document.getElementById('adm-turma').value = "";
            atualizarListaAdm();
        }

        function atualizarListaAdm() {
            const container = document.getElementById('lista-alunos-adm');
            container.innerHTML = "";
            alunos.forEach(a => {
                container.innerHTML += `<div class="lista-item"><span><strong>${a.nome}</strong> - ${a.turma}</span> <span class="tag-pontos">${a.pontos} pts</span></div>`;
            });
        }

        function importarCSV() {
            const input = document.getElementById('arquivo-csv');
            if (!input.files || !input.files[0]) {
                alert("Selecione um arquivo CSV primeiro.");
                return;
            }

            const leitor = new FileReader();
            leitor.onload = function(e) {
                const linhas = e.target.result.split('\n');
                linhas.forEach(linha => {
                    const dados = linha.split(',');
                    if(dados.length >= 2 && dados[0].trim() !== "") {
                        alunos.push({
                            id: alunos.length,
                            nome: dados[0].trim(),
                            turma: dados[1].trim(),
                            pontos: 0,
                            ocorrencias: []
                        });
                    }
                });
                alert("Importação realizada com sucesso!");
                atualizarListaAdm();
            };
            leitor.readAsText(input.files[0]);
        }
    </script>
</body>
</html>
